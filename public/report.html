<!DOCTYPE html>
<html>
<head>

    <title>System Report</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            margin:0;
            font-family:'Poppins',sans-serif;
            background:#0f172a;
            color:white;
        }

        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 40px;
            background:#111827;
            border-bottom:1px solid rgba(255,255,255,0.1);
        }

        .navbar h2{
            margin:0;
        }

        .back-btn{
            padding:10px 18px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

        .container{
            padding:30px;
        }

        .summary-cards{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:#1e293b;
            padding:25px;
            border-radius:16px;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
        }

        .card h3{
            margin-top:0;
            color:#94a3b8;
        }

        .card p{
            font-size:32px;
            margin:10px 0 0;
            font-weight:bold;
        }

        .chart-section{
            background:#1e293b;
            padding:20px;
            border-radius:16px;
            margin-bottom:30px;
            height: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .chart-section canvas{
            height: 220px;
            width: 100%;
        }
        
        .chart-grid{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:#1e293b;
            border-radius:16px;
            overflow:hidden;
        }

        th, td{
            padding:14px;
            border-bottom:1px solid rgba(255,255,255,0.1);
            text-align:left;
        }

        th{
            background:#334155;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>System Analytics Report</h2>

        <button
        class="back-btn"
        onclick="window.location.href='/admin.html'">

            Back to Admin

        </button>

    </div>

    <div class="container">

        <!-- SUMMARY -->

        <div class="summary-cards">

            <div class="card">
                <h3>Total Employees</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="card">
                <h3>Total Files</h3>
                <p id="fileCount">0</p>
            </div>

            <div class="card">
                <h3>Suspicious Logins</h3>
                <p id="suspiciousCount">0</p>
            </div>
             
            <div class="card">
                <h3>Security Risk Level</h3>
                <p id="riskScore">LOW</p>
            </div>

        </div>

        <!-- CHART -->
        <div class="chart-grid">
        <div class="chart-section">

            <h2>Files By Department</h2>

            <canvas id="departmentChart"></canvas>

        </div>

        <div class="chart-section">

            <h2>Department Share</h2>

            <canvas id="deptPie"></canvas>

        </div>

        <div class="chart-section">

            <h2>Suspicious Login Trend</h2>

            <canvas id="trendChart"></canvas>

        </div>

        <div class="chart-section">

            <h2>Login Security Distribution</h2>

            <canvas id="securityPie"></canvas>

        </div>
        </div>

        <!-- SUSPICIOUS LOGINS -->

        <div class="chart-section">

            <h2>Recent Suspicious Activity</h2>

            <table>

                <thead>

                    <tr>
                        <th>Email</th>
                        <th>Reason</th>
                    </tr>

                </thead>

                <tbody id="suspiciousTableBody">

                </tbody>

            </table>

        </div>

    </div>
<script>

async function loadReport(){

    // ================= USERS =================

    const usersRes = await fetch("/admin/users",{
        headers:{
            role: localStorage.getItem("role")
        }
    });

    const users = await usersRes.json();

    document.getElementById(
        "employeeCount"
    ).innerText = users.length;


    // ================= FILES =================

    const filesRes = await fetch("/admin/files",{
        headers:{
            role: localStorage.getItem("role")
        }
    });

    const files = await filesRes.json();

    document.getElementById(
        "fileCount"
    ).innerText = files.length;


    // ================= SUSPICIOUS =================

    const suspiciousRes = await fetch("/admin/suspicious",{
        headers:{
            role: localStorage.getItem("role")
        }
    });

    const suspicious = await suspiciousRes.json();

    document.getElementById(
        "suspiciousCount"
    ).innerText = suspicious.length;


    // ================= TREND DATA =================

    const trendData = {};

    suspicious.forEach(log => {

        const day =
        new Date(log.created_at)
        .toLocaleDateString();

        trendData[day] =
        (trendData[day] || 0) + 1;

    });


    // ================= TABLE =================

    const tbody =
    document.getElementById(
        "suspiciousTableBody"
    );

    tbody.innerHTML = "";

    suspicious.forEach(item => {

        const row =
        document.createElement("tr");

        row.innerHTML = `
            <td>${item.email}</td>
            <td>${item.reason}</td>
        `;

        tbody.appendChild(row);

    });


    // ================= DEPARTMENT COUNTS =================

    const deptCounts = {};

    files.forEach(file => {

        if(deptCounts[file.department]){

            deptCounts[file.department]++;

        }else{

            deptCounts[file.department] = 1;

        }

    });


    // ================= BAR CHART =================

    new Chart(
        document.getElementById("departmentChart"),
        {
            type:"bar",
            data:{
                labels:Object.keys(deptCounts),
                datasets:[{
                    label:"Files",
                    data:Object.values(deptCounts),
                    backgroundColor:["#06b6d4",
                                    "#22c55e",
                                    "#f59e0b",
                                    "#ef4444" ]
                }]
            },
            options:{
                responsive: true,
                maintainAspectRatio: false
            }
        }
    );


    // ================= RISK SCORE =================

    const suspiciousCount =
    suspicious.length;

    const safeCount =
    Math.max(
        (users.length * 10) - suspiciousCount,
        0
    );

    let risk = "LOW";

    if(suspiciousCount > 20)
        risk = "MEDIUM";

    if(suspiciousCount > 50)
        risk = "HIGH";

    document.getElementById(
        "riskScore"
    ).innerText = risk;


    // ================= TREND CHART =================

    new Chart(
        document.getElementById("trendChart"),
        {
            type:"line",
            data:{
                labels:Object.keys(trendData),
                datasets:[{
                    label:"Suspicious Logins",
                    data:Object.values(trendData),
                    borderColor:"#ef4444",
                    backgroundColor:"rgba(239,68,68,0.2)",
                    fill: true,
                    tension:0.3
                }]
            },
            options:{
                responsive: true,
                maintainAspectRatio: false
            }
        }
    );


    // ================= SECURITY PIE =================

    new Chart(
        document.getElementById("securityPie"),
        {
            type:"pie",
            data:{
                labels:[
                    "Safe Logins",
                    "Suspicious Logins"
                ],
                datasets:[{
                    data:[
                        safeCount,
                        suspiciousCount
                    ],
                    backgroundColor:[
                        "#22c55e",
                        "#ef4444"
                    ]
                }]
            },
            options:{
                responsive: true,
                maintainAspectRatio: false
            },
            plugins:{
                legend:{
                    position:'bottom'
                }
            }
        }
    );


    // ================= DEPARTMENT PIE =================

    new Chart(
        document.getElementById("deptPie"),
        {
            type:"pie",
            data:{
                labels:Object.keys(deptCounts),
                datasets:[{
                    data:Object.values(deptCounts),
                    backgroundColor:[
                        "#3b82f6",
                        "#22c55e",
                        "#f59e0b",
                        "#ef4444",
                        "#8b5cf6",
                        "#06b6d4"
                    ]
                }]
            },
            options:{
                responsive: true,
                maintainAspectRatio: false
            },
            plugins:{
                legend:{
                    position: 'bottom'
                }
            }
        }
    );

}

loadReport();

</script>

</body>
</html>
